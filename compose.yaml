# Local development: `docker compose up -d` (merges compose.override.yaml automatically).
# For TrueNAS deployment see compose.truenas.yaml.
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/data.db
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # HTTP
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      # HTTPS
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp

volumes:
  caddy_data:
  caddy_config:
